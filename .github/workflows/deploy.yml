name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker authentication
        run: |
          gcloud auth configure-docker asia-east1-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            -t asia-east1-docker.pkg.dev/adam-backend-service/backend-service/backend-service:${{ github.sha }} \
            -t asia-east1-docker.pkg.dev/adam-backend-service/backend-service/backend-service:latest \
            .

      - name: Push Docker image
        run: |
          docker push asia-east1-docker.pkg.dev/adam-backend-service/backend-service/backend-service:${{ github.sha }}
          docker push asia-east1-docker.pkg.dev/adam-backend-service/backend-service/backend-service:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy backend-service \
            --image asia-east1-docker.pkg.dev/adam-backend-service/backend-service/backend-service:${{ github.sha }} \
            --region asia-east1 \
            --platform managed \
            --quiet